apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-hello-deployment
spec:
  replicas: 4
  selector:
    matchLabels:
      app: hello-web
  template:
    metadata:
      labels:
        app: hello-web
    spec:
      containers:
      - name: hello-ctr
        image: paulbouwer/hello-kubernetes:1.10
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: app-hello-servicio
spec:
  type: LoadBalancer
  selector:
    app: hello-web
  ports:
    - protocol: TCP
      port: 9091
      targetPort: 8080
